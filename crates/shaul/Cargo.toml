[package]
name = "shaul"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Embeddable multi-protocol download engine"
readme = "README.md"

[dependencies]
shaul-bt = { workspace = true, optional = true }
shaul-core.workspace = true
shaul-dash = { workspace = true, optional = true }
shaul-ftp = { workspace = true, optional = true }
shaul-hls = { workspace = true, optional = true }
shaul-hub.workspace = true
shaul-http.workspace = true

[features]
default = []
bt = ["dep:shaul-bt"]
dash = ["dep:shaul-dash"]
ftp = ["dep:shaul-ftp"]
hls = ["dep:shaul-hls"]
xet = ["shaul-hub/xet"]

[dev-dependencies]
async-trait.workspace = true
criterion = "0.8"
flate2.workspace = true
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio.workspace = true
url.workspace = true

[[bench]]
name = "http"
harness = false
