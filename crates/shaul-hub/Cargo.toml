[package]
name = "shaul-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Hugging Face and ModelScope parsers and backends for shaul"
readme = "README.md"

[dependencies]
async-trait.workspace = true
base64.workspace = true
directories.workspace = true
globset.workspace = true
hf-xet = { workspace = true, optional = true }
http.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
shaul-core.workspace = true
shaul-http.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

# These exact constraints keep hf-xet's caret dependencies on the 1.6 line;
# 1.7+ pulls sysinfo 0.39, which requires Rust 1.95 and would raise shaul's
# MSRV.
xet-client = { version = "=1.6.0", optional = true }
xet-core-structures = { version = "=1.6.0", optional = true }
xet-data = { version = "=1.6.0", optional = true }
xet-runtime = { version = "=1.8.1", optional = true }

[features]
default = []
xet = [
    "dep:hf-xet",
    "dep:xet-client",
    "dep:xet-core-structures",
    "dep:xet-data",
    "dep:xet-runtime",
]

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
