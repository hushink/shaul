[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
async-trait = "0.1"
shaul = { version = "1.2.2", path = "crates/shaul" }
shaul-bt = { version = "1.2.2", path = "crates/shaul-bt" }
shaul-core = { version = "1.2.2", path = "crates/shaul-core" }
shaul-ftp = { version = "1.2.2", path = "crates/shaul-ftp" }
shaul-hls = { version = "1.2.2", path = "crates/shaul-hls" }
shaul-hub = { version = "1.2.2", path = "crates/shaul-hub" }
shaul-http = { version = "1.2.2", path = "crates/shaul-http" }
base64 = "0.23"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
digest = "0.11"
directories = "6"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
fs2 = "0.4"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
# 1.7+ pulls xet-runtime -> sysinfo 0.39, which requires Rust 1.95.
# Keep the exact 1.6 line so shaul stays on its 1.92 MSRV.
hf-xet = "=1.6.0"
http = "1"
indicatif = "0.18"
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
md-5 = "0.11"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "socks"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.11"
sha2 = "0.11"
suppaftp = { version = "13", default-features = false, features = ["tokio"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "signal", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.package]
version = "1.2.2"
edition = "2024"
rust-version = "1.92"
authors = ["weilanzhuan@gmail.com"]
license = "Apache-2.0"
repository = "https://github.com/hushink/shaul"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
