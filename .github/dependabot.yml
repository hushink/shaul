version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The xet crates are exact-pinned to the 1.6 line because 1.7+ pulls
    # sysinfo 0.39, which requires Rust 1.95 and would raise shaul's MSRV.
    ignore:
      - dependency-name: "hf-xet"
        versions: [">=1.7"]
      - dependency-name: "xet-client"
        versions: [">=1.7"]
      - dependency-name: "xet-core-structures"
        versions: [">=1.7"]
      - dependency-name: "xet-data"
        versions: [">=1.7"]
      - dependency-name: "xet-runtime"
        versions: [">=1.7"]
      - dependency-name: "sysinfo"
        versions: [">=0.39"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
    groups:
      actions:
        patterns: ["*"]
    # This action is referenced by toolchain version (e.g. @1.92.0), which
    # Dependabot mistakes for an action release. The MSRV is managed manually.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    commit-message:
      prefix: "chore(ci)"
