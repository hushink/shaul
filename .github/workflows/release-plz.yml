name: Release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz-release:
    name: release-plz release
    if: github.repository_owner == 'hushink'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      actions: write
      # Allows a later migration to crates.io trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Bootstrap only: new crates must be published once with an API token.
      # Once all crates exist and trusted publishing is configured, delete the
      # CARGO_REGISTRY_TOKEN secret. This step then leaves the variable unset
      # and release-plz obtains a short-lived token via GitHub OIDC.
      - name: Select crates.io credentials
        env:
          CARGO_REGISTRY_TOKEN_SECRET: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "${CARGO_REGISTRY_TOKEN_SECRET}" ]; then
            printf 'CARGO_REGISTRY_TOKEN=%s\n' "${CARGO_REGISTRY_TOKEN_SECRET}" >> "$GITHUB_ENV"
          else
            echo "CARGO_REGISTRY_TOKEN is unset; using crates.io trusted publishing."
          fi
      - uses: release-plz/action@v0.5.148
        id: release
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      # GITHUB_TOKEN-created tags do not trigger tag-push workflows, so
      # dispatch cargo-dist explicitly. workflow_dispatch is exempt from that
      # suppression, and this keeps CLI binaries working without a PAT.
      - name: Trigger CLI binary build
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_JSON: ${{ steps.release.outputs.releases }}
        run: |
          set -euo pipefail
          tag=$(jq -r 'first((if type == "array" then .[]? else .releases[]? end) | select(.tag | startswith("shaul-cli-v")) | .tag) // empty' <<< "$RELEASES_JSON")
          if [ -n "$tag" ]; then
            gh workflow run shaul-cli-release.yml --ref "$tag" -f tag="$tag"
          fi

  release-plz-pr:
    name: release-plz PR
    if: github.repository_owner == 'hushink'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
