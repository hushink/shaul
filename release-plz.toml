[workspace]
# Publish only after the release PR is merged, not on every push to main.
release_always = false
# Do not cut a release for test/docs/chore-only commits. Dependency bumps
# (Dependabot writes `chore(deps): ...`) still need releases.
release_commits = '^(feat|fix|perf|refactor|chore\(deps\))'
# One consolidated changelog for the whole workspace; all crates share the
# workspace version. Internal crates do not get their own CHANGELOG files.
changelog_path = "CHANGELOG.md"
changelog_update = false
git_release_enable = true
# The 1.0.0 release is the semver baseline for API-breaking-change checks.
semver_check = true
publish_timeout = "15m"
pr_labels = ["release"]

# The facade crate owns the single root changelog and pulls in commits from
# every other workspace package so release notes cover the whole project.
[[package]]
name = "shaul"
changelog_update = true
changelog_include = ["shaul-core", "shaul-http", "shaul-hub", "shaul-bt", "shaul-cli"]

# cargo-dist creates the GitHub Release for the CLI so it can attach binaries.
# release-plz still publishes the crate and creates the git tag.
[[package]]
name = "shaul-cli"
git_release_enable = false
