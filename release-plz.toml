[workspace]
# Publish only after the release PR is merged, not on every push to main.
release_always = false
# One changelog for the whole workspace; all crates share the workspace version.
changelog_path = "CHANGELOG.md"
git_release_enable = true
# Enable once the 1.0.0 tag exists as a semver baseline.
semver_check = false
publish_timeout = "15m"
pr_labels = ["release"]
