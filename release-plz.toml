[workspace]
# Publish only after the release PR is merged, not on every push to main.
release_always = false
# One consolidated changelog for the whole workspace; all crates share the
# workspace version. Internal crates do not get their own CHANGELOG files.
changelog_path = "CHANGELOG.md"
changelog_update = false
git_release_enable = true
# Enable once the 1.0.0 tag exists as a semver baseline.
semver_check = false
publish_timeout = "15m"
pr_labels = ["release"]

# The facade crate owns the single root changelog and pulls in commits from
# every other workspace package so release notes cover the whole project.
[[package]]
name = "shaul"
changelog_update = true
changelog_include = ["shaul-core", "shaul-http", "shaul-hub", "shaul-bt", "shaul-cli"]
